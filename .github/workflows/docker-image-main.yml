name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false

env:
  DOCKERHUB_REPO: idealyouth/new-api

jobs:
  build_single_arch:
    name: Build (${{ matrix.arch }}) [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    outputs:
      digest-amd64: ${{ steps.build.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.build.outputs.digest-arm64 }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ghcr.io/${{ env.GHCR_REPOSITORY }}

      - name: Build & push by digest (Docker Hub)
        id: build-dockerhub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKERHUB_REPO }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Build & push by digest (GHCR)
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.GHCR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}-ghcr
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-ghcr
          provenance: false
          sbom: false

      - name: Export digest
        id: build
        run: |
          echo "digest-${{ matrix.arch }}=${{ steps.build-dockerhub.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "digest-${{ matrix.arch }}-ghcr=${{ steps.build-ghcr.outputs.digest }}" >> $GITHUB_OUTPUT

      - name: Save digests to file
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build-dockerhub.outputs.digest }}" > /tmp/digests/dockerhub-${{ matrix.arch }}
          echo "${{ steps.build-ghcr.outputs.digest }}" > /tmp/digests/ghcr-${{ matrix.arch }}

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            VERSION=""
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Read digests
        id: digests
        run: |
          echo "dockerhub-amd64=$(cat /tmp/digests/dockerhub-amd64)" >> $GITHUB_OUTPUT
          echo "dockerhub-arm64=$(cat /tmp/digests/dockerhub-arm64)" >> $GITHUB_OUTPUT
          echo "ghcr-amd64=$(cat /tmp/digests/ghcr-amd64)" >> $GITHUB_OUTPUT
          echo "ghcr-arm64=$(cat /tmp/digests/ghcr-arm64)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest (Docker Hub - latest)
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_REPO }}:latest \
            ${{ env.DOCKERHUB_REPO }}@${{ steps.digests.outputs.dockerhub-amd64 }} \
            ${{ env.DOCKERHUB_REPO }}@${{ steps.digests.outputs.dockerhub-arm64 }}

      - name: Create manifest (Docker Hub - versioned)
        if: steps.version.outputs.is_tag == 'true'
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_REPO }}:${{ steps.version.outputs.value }} \
            ${{ env.DOCKERHUB_REPO }}@${{ steps.digests.outputs.dockerhub-amd64 }} \
            ${{ env.DOCKERHUB_REPO }}@${{ steps.digests.outputs.dockerhub-arm64 }}

      - name: Create manifest (GHCR - latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.GHCR_REPOSITORY }}:latest \
            ghcr.io/${{ env.GHCR_REPOSITORY }}@${{ steps.digests.outputs.ghcr-amd64 }} \
            ghcr.io/${{ env.GHCR_REPOSITORY }}@${{ steps.digests.outputs.ghcr-arm64 }}

      - name: Create manifest (GHCR - versioned)
        if: steps.version.outputs.is_tag == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ steps.version.outputs.value }} \
            ghcr.io/${{ env.GHCR_REPOSITORY }}@${{ steps.digests.outputs.ghcr-amd64 }} \
            ghcr.io/${{ env.GHCR_REPOSITORY }}@${{ steps.digests.outputs.ghcr-arm64 }}
